<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline</title>
    <link rel="stylesheet" href="style.css">
    <!-- Adding Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <h1>Timeline</h1>
        <nav class="header-nav">
            <div id="controls-container" class="controls-container">
                <div class="zoom-control">
                    <span>Year</span>
                    <label class="switch">
                        <input type="checkbox" id="zoom-toggle">
                        <span class="slider round"></span>
                    </label>
                    <span>Month</span>
                </div>
                <div class="search-container">
                    <i class="fas fa-search"></i>
                </div>
            <button id="login-btn" class="auth-btn" title="Login / Sign Up"><i class="fas fa-sign-in-alt"></i></button>
                <div id="user-info" style="display: none;">
                    <span id="user-email"></span>
                <button id="logout-btn" class="auth-btn" title="Logout"><i class="fas fa-sign-out-alt"></i></button>
                </div>
            <button id="add-event-btn" class="add-btn" title="Add New Event"><i class="fas fa-plus"></i></button>
            </div>
        </nav>
        <button id="mobile-menu-btn" class="mobile-menu-btn">
            <i class="fas fa-ellipsis-v"></i>
        </button>
    </header>
    <div id="timeline-container">
        <!-- Events will be dynamically inserted here -->
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

    <!-- The Modal -->
    <div id="add-event-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Add New Event</h2>
            <form id="add-event-form">
                <label for="event-name-input">Event Name:</label>
                <input type="text" id="event-name-input" name="name" required>

                <label for="start-date-input">Start Date:</label>
                <input type="date" id="start-date-input" name="startDate" required>

                <label for="end-date-input">End Date:</label>
                <input type="date" id="end-date-input" name="endDate">

                <label for="description-input">Description:</label>
                <textarea id="description-input" name="description"></textarea>

                <label for="photo-album-input">Photo Album Link:</label>
                <input type="url" id="photo-album-input" name="photoAlbum">

                <label for="metadata-input">Metadata (key:value, one per line):</label>
                <textarea id="metadata-input" name="metadata"></textarea>

                <button type="submit">Save Event</button>
            </form>
        </div>
    </div>

    <!-- The Login Modal -->
    <div id="login-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn login-close-btn">&times;</span>
            <h2>Login / Sign Up</h2>
            <form id="login-form">
                <label for="email-input">Email:</label>
                <input type="email" id="email-input" name="email" required>

                <label for="password-input">Password:</label>
                <input type="password" id="password-input" name="password" required>

                <div class="form-actions">
                    <button type="submit" id="login-submit-btn">Login</button>
                    <button type="button" id="signup-submit-btn">Sign Up</button>
                </div>
                <p id="auth-error" class="auth-error"></p>
            </form>
        </div>
    </div>
</body>
</html>

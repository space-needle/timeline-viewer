<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timeline</title>
    <link rel="stylesheet" href="style.css">
    <!-- Adding Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <h1>Timeline</h1>
        <div class="controls-container">
            <div class="zoom-control">
                <span>Year</span>
                <label class="switch">
                    <input type="checkbox" id="zoom-toggle">
                    <span class="slider round"></span>
                </label>
                <span>Month</span>
            </div>
            <div class="search-container">
                <i class="fas fa-search"></i>
            </div>
            <button id="add-event-btn" class="add-btn"><i class="fas fa-plus"></i> Add Event</button>
        </div>
    </header>
    <div id="timeline-container">
        <!-- Events will be dynamically inserted here -->
    </div>
    <script src="script.js"></script>

    <!-- The Modal -->
    <div id="add-event-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>Add New Event</h2>
            <form id="add-event-form">
                <label for="event-name-input">Event Name:</label>
                <input type="text" id="event-name-input" name="name" required>

                <label for="start-date-input">Start Date:</label>
                <input type="date" id="start-date-input" name="startDate" required>

                <label for="end-date-input">End Date:</label>
                <input type="date" id="end-date-input" name="endDate">

                <label for="description-input">Description:</label>
                <textarea id="description-input" name="description"></textarea>

                <label for="photo-album-input">Photo Album Link:</label>
                <input type="url" id="photo-album-input" name="photoAlbum">

                <label for="metadata-input">Metadata (key:value, one per line):</label>
                <textarea id="metadata-input" name="metadata"></textarea>

                <button type="submit">Save Event</button>
            </form>
        </div>
    </div>
</body>
</html>
